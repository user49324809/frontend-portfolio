name: CI

on:
  push:
    branches:
      - fix/mobile-about-layout
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: node --test

      - name: Run linter
        run: npm run lint

      - name: Build production bundle
        run: npm run build
